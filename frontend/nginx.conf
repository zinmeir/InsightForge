# Serves the built SPA and reverse-proxies /api to the backend, so the browser only ever
# talks to one origin (no CORS, no hard-coded API URLs).

limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

upstream insightforge_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 5m;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Brute-force protection for the login endpoint.
    location = /api/v1/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://insightforge_backend;
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/v1/stream {
        proxy_pass http://insightforge_backend;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://insightforge_backend;
        proxy_read_timeout 60s;
    }

    # Vite emits content-hashed file names, so assets can be cached forever.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
